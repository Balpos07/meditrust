services:
  - type: web
    name: meditrust-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MONNIFY_API_KEY
        sync: false
      - key: MONNIFY_SECRET_KEY
        sync: false
      - key: MONNIFY_CONTRACT_CODE
        sync: false

  - type: web
    name: meditrust-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        value: "https://meditrust-backend.onrender.com"
      - key: VITE_WS_URL
        value: "wss://meditrust-backend.onrender.com"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
